<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 - Page Not Found</title>

  <style>
    :root {
      --primary:        #16a34a;
      --primary-dark:   #15803d;
      --primary-light:  rgba(22, 163, 74, 0.09);
      --primary-glow:   rgba(22, 163, 74, 0.16);

      --bg:             #f0f5f2;
      --bg-card:        #ffffff;

      --border:         #cdddd5;

      --text:           #0f1e17;
      --text-muted:     #4a7060;

      --font-sans:      'Segoe UI', system-ui, sans-serif;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:var(--font-sans);
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .card{
      width:100%;
      max-width:500px;
      background:var(--bg-card);
      border:1px solid var(--border);
      border-radius:24px;
      padding:50px 35px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.05);
    }

    h1{
      font-size:110px;
      line-height:1;
      color:var(--primary);
      margin-bottom:10px;
      font-weight:800;
    }

    h2{
      font-size:30px;
      margin-bottom:14px;
    }

    p{
      color:var(--text-muted);
      font-size:16px;
      line-height:1.7;
      margin-bottom:30px;
    }

    a{
      display:inline-block;
      text-decoration:none;
      background:var(--primary);
      color:#fff;
      padding:14px 24px;
      border-radius:12px;
      font-weight:600;
      transition:0.3s;
    }

    a:hover{
      background:var(--primary-dark);
      transform:translateY(-2px);
    }

    @media(max-width:600px){
      h1{
        font-size:80px;
      }

      h2{
        font-size:24px;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>404</h1>

    <h2>Page Not Found</h2>

    <p>
      The page you are looking for doesn't exist
      or has been moved.
    </p>

    <a href="{{ site.url }}">Go Back Home</a>
  </div>

</body>
</html>
