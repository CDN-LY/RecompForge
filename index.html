<!DOCTYPE html>
<html>
<head>
<title>Support Survey</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
}

.support-box{
width:350px;
margin:50px auto;
background:white;
padding:25px;
border-radius:15px;
text-align:center;
}


button{
background:#2563eb;
color:white;
border:none;
padding:12px 20px;
border-radius:8px;
cursor:pointer;
}


.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.6);
align-items:center;
justify-content:center;
}


.modal-box{

background:white;
width:90%;
max-width:600px;
height:600px;
border-radius:15px;
overflow:hidden;

}


.close{

float:right;
padding:10px;
cursor:pointer;

}


iframe{

width:100%;
height:100%;
border:0;

}



.support-list{

margin-top:20px;

}



.user{

padding:10px;
border-bottom:1px solid #ddd;

}


.loading{

color:#777;

}


.error{

color:red;

}

</style>

</head>


<body>


<div class="support-box">

<h2>Support Website</h2>


<p>
Complete a survey to support this website
</p>


<button onclick="openSurvey()">
Start Survey
</button>



<h3>
Recent Support
</h3>


<div id="recent">

<div class="loading">
Loading supporters...
</div>


</div>


</div>





<!-- MODAL -->


<div class="modal" id="surveyModal">


<div class="modal-box">


<div class="close" onclick="closeSurvey()">
✖
</div>


<div id="cpxContainer">


</div>



</div>


</div>





<script>


// =====================
// Local User ID
// =====================


function getUserID(){


let id =
localStorage.getItem(
"support_user_id"
);



if(!id){


id =
"support_user_" +
Math.random()
.toString(36)
.substring(2,12);



localStorage.setItem(
"support_user_id",
id
);



}


return id;


}




const userID=getUserID();

console.log(userID);





// =====================
// Modal Open
// =====================


function openSurvey(){


document
.getElementById("surveyModal")
.style.display="flex";



generateCPX();



}




// Close

function closeSurvey(){

document
.getElementById("surveyModal")
.style.display="none";


}




// =====================
// CPX iframe Generate
// =====================



function generateCPX(){



let container=
document.getElementById(
"cpxContainer"
);



container.innerHTML="";


let iframe =
document.createElement(
"iframe"
);



iframe.src=
"https://offers.cpx-research.com/index.php?"+
"app_id=34411"+
"&ext_user_id="+userID;



container.appendChild(
iframe
);



}







// =====================
// Recent Support Fetch
// =====================



async function loadRecent(){


let box=
document.getElementById(
"recent"
);



try{


box.innerHTML=
`
<div class="loading">
Loading...
</div>
`;



let res =
await fetch(
"/api/recent"
);



if(!res.ok)
throw "API Error";



let data =
await res.json();



box.innerHTML="";



data.forEach(
user=>{


box.innerHTML +=
`

<div class="user">

${user.flag || "🌎"}

<b>
${user.name}
</b>

<br>

<small>
${user.time}
</small>


</div>


`;



});


}
catch(e){


box.innerHTML=
`
<div class="error">
Unable to load supporters
</div>
`;



}



}




// Initial Load

loadRecent();



// Auto Refresh every 30 sec


setInterval(
loadRecent,
30000
);



</script>


</body>
</html>
