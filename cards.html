---
title: Blog Cards
---

<div class="blog-grid">

{% assign random_cards = site.data.cards | sample: 4 %}

{% for card in random_cards %}

<div class="blog-card visible">

    <div class="blog-thumb">
        <i class="bi {{ card.icon }}"
           style="font-size:2.4rem;color:{{ card.color }}">
        </i>
    </div>

    <div class="blog-content">

        <span class="blog-badge {{ card.badgeClass }}">
            {{ card.badge }}
        </span>

        <div class="blog-title">
            {{ card.title }}
        </div>

        <div class="blog-excerpt">
            {{ card.excerpt }}
        </div>

        <a href="{{ card.url }}" class="blog-read">
            Read Guide
            <i class="bi bi-arrow-right"></i>
        </a>

    </div>

</div>

{% endfor %}

</div>
